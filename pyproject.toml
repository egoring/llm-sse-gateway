[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-sse-gateway"
version = "0.1.0"
description = "FastAPI gateway that streams LLM responses over SSE with a pre-first-token fallback chain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
llm-sse-gateway = "llm_sse_gateway.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_sse_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
